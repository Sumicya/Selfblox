name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Luau
        run: |
          # 版本钉死: 换版本要连 smoke.lua 一起复跑, 不要顺手升
          curl -fsSL -o /tmp/luau.zip https://github.com/luau-lang/luau/releases/download/0.741/luau-ubuntu.zip
          unzip -o -q /tmp/luau.zip -d /tmp/luau-bin
          sudo install -m 0755 "$(find /tmp/luau-bin -type f -name luau | head -1)" /usr/local/bin/luau
          ls -l /usr/local/bin/luau
      - name: Run offline self-check
        run: |
          cat > /tmp/probe.lua <<'LUA'
          local function w(k, v) print(k .. " = " .. tostring(v)) end
          w("_G 可写", (pcall(function() _G.__probe = 1 end)))
          w("裸全局可写", (pcall(function() __probe2 = 1 end)))
          w("os.exit", os and os.exit)
          w("io.open", io and io.open)
          w("debug.getinfo", debug and debug.getinfo)
          w("debug.info", debug and debug.info)
          w("loadstring", loadstring)
          LUA
          luau /tmp/probe.lua 2>&1 | sed -e 's/%/%25/g' -e 's/^/::notice::/'
          { printf 'local SB_SRC_INJECTED = [====[\n'; cat selfblox.lua; printf '\n]====]\n\n'; cat smoke.lua; } > /tmp/sb_smoke.lua
          set +e
          out=$(luau /tmp/sb_smoke.lua 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out" | tail -40
          if [ "$rc" -ne 0 ]; then
            { printf '%s\n' "$out" | grep -n '✗' | head -10; printf '%s\n' "$out" | tail -4; } | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/^/::error::/'
            exit "$rc"
          fi
      - name: Read version
        id: ver
        run: |
          V=$(sed -n 's/^local VERSION = "\([^"]*\)".*/\1/p' selfblox.lua | head -1)
          test -n "$V" || { echo "取不到 VERSION"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "版本 = $V"
      - name: Package
        run: |
          mkdir -p dist
          cp selfblox.lua dist/selfblox.lua
          ls -l dist
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Selfblox-${{ steps.ver.outputs.version }}
          path: dist/selfblox.lua
          retention-days: 5
          if-no-files-found: error

  # 滚动清理: 出包成功后串行执行, 只删本仓库自己工作流产生的 artifact, 保留最近 5 个。
  # 第二十一版【CI 滚动清理】: 完整分页、按「项目名(大小写不敏感)+-」前缀筛选、KEEP 必须是正整数、
  # 删前打印完整清单、不删任何最新对象、清理失败只报错不回滚。本 job 不 checkout 代码, 因此不执行来自 PR 的代码。
  clean-artifacts:
    needs: smoke
    runs-on: ubuntu-24.04
    concurrency:
      group: selfblox-clean-artifacts
      cancel-in-progress: false
    permissions:
      actions: write
    steps:
      - name: Keep newest 5 Selfblox-* artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          KEEP: "5"
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys
          repo = os.environ["REPO"]
          try:
              keep = int(os.environ["KEEP"])
          except ValueError:
              sys.exit("KEEP 不是整数: " + os.environ["KEEP"])
          if keep < 1:
              sys.exit(f"KEEP 必须是正整数, 现在是 {keep}")
          def api(url, method="GET"):
              cmd = ["gh", "api"] + (["-X", method] if method != "GET" else []) + [url]
              r = subprocess.run(cmd, capture_output=True, text=True)
              if r.returncode != 0:
                  sys.exit(f"gh api {url} 失败: {r.stderr.strip()}")
              return r.stdout
          items, page = [], 1
          while True:                      # 完整分页, 不拿固定 100 当全量
              d = json.loads(api(f"repos/{repo}/actions/artifacts?per_page=100&page={page}"))
              batch = d.get("artifacts", [])
              items += batch
              if len(batch) < 100:
                  break
              page += 1
          mine = [a for a in items if a["name"].lower().startswith("selfblox-")]
          mine.sort(key=lambda a: a["created_at"], reverse=True)
          print(f"全仓 artifact {len(items)} 个; selfblox- 前缀 {len(mine)} 个; 保留最近 {keep} 个")
          for i, a in enumerate(mine):
              print("  保留" if i < keep else "  待删除", a["id"], a["name"], a["created_at"])
          for a in mine[keep:]:
              print("删除", a["id"], a["name"])
              api(f"repos/{repo}/actions/artifacts/{a['id']}", "DELETE")
          print("清理完成")
          PY

